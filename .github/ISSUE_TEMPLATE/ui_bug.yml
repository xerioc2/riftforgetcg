name: UI bug
description: Report layout, interaction, readability, or usability bugs.
title: "[UI] "
labels: ["ui bug"]
body:
  - type: input
    id: build_version
    attributes:
      label: Build/release version
      description: Use the value from Alpha limits or copied debug info if available.
      placeholder: "Example: 0.1.0-alpha (v0.1.0-alpha.4)"
  - type: textarea
    id: issue
    attributes:
      label: What looked or felt wrong?
    validations:
      required: true
  - type: input
    id: room_code
    attributes:
      label: Room code
      description: Optional, if this happened during a game.
  - type: dropdown
    id: matchup
    attributes:
      label: Matchup
      options:
        - Human vs RiftBot
        - Human vs human
        - Spectator
        - Not in a game
        - Other
  - type: input
    id: game_mode
    attributes:
      label: Game mode
      placeholder: "ENFORCED, SANDBOX, unknown"
  - type: dropdown
    id: supported_cards_only
    attributes:
      label: Supported-cards-only mode
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: players
    attributes:
      label: Player names and roles
  - type: input
    id: phase
    attributes:
      label: Phase or showdown state
  - type: input
    id: card
    attributes:
      label: Card involved
      placeholder: "Optional"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows desktop installer, Chrome, Firefox, etc."
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: If this happened in a game, use "Copy debug info" and paste the result here.
      render: json
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or video
