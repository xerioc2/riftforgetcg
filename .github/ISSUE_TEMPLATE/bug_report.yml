name: Bug report
description: Report a gameplay, app, or playtest blocker.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing RiftForge. Please do not paste session tokens or hidden opponent information.
  - type: input
    id: build_version
    attributes:
      label: Build/release version
      description: Use the value from Alpha limits or copied debug info if available.
      placeholder: "Example: 0.1.0-alpha (v0.1.0-alpha.4)"
  - type: input
    id: room_code
    attributes:
      label: Room code
      placeholder: "Example: 7Q2M"
  - type: dropdown
    id: matchup
    attributes:
      label: Matchup
      options:
        - Human vs RiftBot
        - Human vs human
        - Spectator
        - Other
  - type: input
    id: game_mode
    attributes:
      label: Game mode
      placeholder: "ENFORCED, SANDBOX, unknown"
  - type: dropdown
    id: supported_cards_only
    attributes:
      label: Supported-cards-only mode
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: players
    attributes:
      label: Player names and roles
      description: Example: xerioc = host/local player, RiftBot = opponent.
  - type: input
    id: phase
    attributes:
      label: Phase or showdown state
      placeholder: "MAIN, AWAKEN, active showdown, etc."
  - type: input
    id: card
    attributes:
      label: Card involved
      placeholder: "Optional"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start a game...\n2. Keep hand...\n3. Click..."
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Copied debug info
      description: Use the in-game Copy debug info or Report issue helper.
      render: json
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or video
