name: Multiplayer/session bug
description: Report lobby, matchmaking, reconnect, token, or desync issues.
title: "[Session] "
labels: ["multiplayer/session bug"]
body:
  - type: input
    id: build_version
    attributes:
      label: Build/release version
      description: Use the value from Alpha limits or copied debug info if available.
      placeholder: "Example: 0.1.0-alpha (v0.1.0-alpha.4)"
  - type: textarea
    id: issue
    attributes:
      label: What happened?
    validations:
      required: true
  - type: dropdown
    id: matchup
    attributes:
      label: Matchup
      options:
        - Human vs RiftBot
        - Human vs human
        - Spectator
        - Other
  - type: input
    id: game_mode
    attributes:
      label: Game mode
      placeholder: "ENFORCED, SANDBOX, unknown"
  - type: dropdown
    id: supported_cards_only
    attributes:
      label: Supported-cards-only mode
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: players
    attributes:
      label: Player names and roles
  - type: input
    id: phase
    attributes:
      label: Phase or showdown state
  - type: input
    id: card
    attributes:
      label: Card involved
      placeholder: "Optional"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: room
    attributes:
      label: Room code
      description: Optional. Do not share private tokens.
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: Use the in-game "Copy debug info" button and paste the result here.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Screenshot, console logs, or server logs
