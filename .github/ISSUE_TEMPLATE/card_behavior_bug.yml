name: Card behavior bug
description: Report a card that resolves incorrectly or is unsupported unexpectedly.
title: "[Card] "
labels: ["card behavior bug"]
body:
  - type: input
    id: build_version
    attributes:
      label: Build/release version
      description: Use the value from Alpha limits or copied debug info if available.
      placeholder: "Example: 0.1.0-alpha (v0.1.0-alpha.4)"
  - type: input
    id: card
    attributes:
      label: Card name
      placeholder: "Example: Defy"
    validations:
      required: true
  - type: input
    id: room_code
    attributes:
      label: Room code
  - type: dropdown
    id: matchup
    attributes:
      label: Matchup
      options:
        - Human vs RiftBot
        - Human vs human
        - Spectator
        - Other
  - type: input
    id: game_mode
    attributes:
      label: Game mode
      placeholder: "ENFORCED, SANDBOX, unknown"
  - type: dropdown
    id: supported_cards_only
    attributes:
      label: Supported-cards-only mode
      options:
        - "No"
        - "Yes"
        - "Not sure"
  - type: textarea
    id: players
    attributes:
      label: Player names and roles
  - type: input
    id: phase
    attributes:
      label: Phase or showdown state
  - type: textarea
    id: expected
    attributes:
      label: Expected card behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual RiftForge behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start a game...\n2. Draw/play the card...\n3. Choose..."
    validations:
      required: true
  - type: textarea
    id: deck
    attributes:
      label: Deck or starter deck used
      description: Do not include hidden opponent information.
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: Use the in-game "Copy debug info" button and paste the result here.
      render: json
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
